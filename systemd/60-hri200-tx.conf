# Installed as /etc/alsa/conf.d/60-hri200-tx.conf: direwolf-hri200's transmit
# audio, 6 dB down on both channels of the HRI-200's codec. direwolf 1.7
# writes a full-scale tone (-3 dBFS) and the codec has no playback volume;
# the CW probe the DR-1X sent clean was -9 dBFS.
pcm.hri200_tx {
	type plug
	slave.pcm "hw:CARD=codec,DEV=0"
	ttable.0.0 0.5
	ttable.0.1 0.5
}
