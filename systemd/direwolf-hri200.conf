# direwolf on the HRI-200's radio (the DR-1X repeater), receive and transmit.
#
# Audio in and out: the HRI-200's audio codec, owned by the host
# (snd-usb-audio, card "codec"; WIRES-X has a fake one). direwolf holds it
# open all the time, which also keeps the codec streaming for hri200-analog's
# usbmon recorder.
#
# PTT: the fake CM108 that hri200-ysf -ptt presents (uhid; udev names it
# /dev/hri200-ptt). On PTT the proxy switches the repeater's WIRES Operation to
# Analog, keys it, and switches it back to Digital once PTT drops, about 250 ms
# each way. PTT is refused while the channel is busy (WIRES-X, a reception, a
# client's over): the packet goes nowhere and its sender retries.
#
# Nothing transmits on its own (no beacons, no digipeating): only what a KISS
# or AGW client on this host sends, under its source callsign.

ADEVICE plughw:CARD=codec,DEV=0 hri200_tx
ARATE 48000
ACHANNELS 1

CHANNEL 0
MYCALL N0CALL
MODEM 1200
PTT CM108 /dev/hri200-ptt
# 10 ms units. The proxy keys about 150-250 ms after PTT (switch echoed at
# 76 ms, settled at 116, keyed 23 ms after pttOn; tick 50 ms). With 500 ms a
# UA keyed the repeater for 0.59 s and was neither heard nor decoded
# (2026-11-07 00:42:20); testing whether the DR-1X needs longer before its
# analog TX audio is on the air.
TXDELAY 100
# The proxy only switches an idle radio: wait out the repeater's hang (SQLT,
# now 1000 ms) after repeating a packet, plus up to 1 s before WIRES-X's next
# status query shows the radio idle, before keying. 10 ms units.
DWAIT 250
TXTAIL 10

# Connected mode (ax25-door): every transmission here costs the switch to
# Analog and back, and the far end's goes through the repeater, so allow
# more than the default 3 s for an ack.
FRACK 6

# Only localhost can connect (direwolf-hri200.service: IPAddressAllow).
KISSPORT 8001
AGWPORT 8000

# Every decoded frame, one CSV file a day (direwolf-hri200.service: StateDirectory).
LOGDIR /var/lib/direwolf-hri200
